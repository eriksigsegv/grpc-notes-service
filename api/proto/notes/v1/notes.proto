syntax = "proto3";

package eriksigsegv.notes.v1;

option go_package = "github.com/eriksigsegv/grpc-notes-service/api/proto/notes/v1;notesv1";

service NotesService {
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
}

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message Note {
  string id = 1;
  string title = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateNoteRequest {
  string title = 1;
  string content = 2;
}

message CreateNoteResponse { Note note = 1; }

message GetNoteRequest { string id = 1; }

message GetNoteResponse { Note note = 1; }

message UpdateNoteRequest {
  string id = 1;
  string title = 2;
  string content = 3;
}

message UpdateNoteResponse { Note note = 1; }

message DeleteNoteRequest { string id = 1; }

message DeleteNoteResponse { google.protobuf.Empty empty = 1; }

message ListNotesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListNotesResponse { repeated Note notes = 1; }
